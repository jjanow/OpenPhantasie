# Builds OpenPhantasie for players (s174). Runs only for a release (user s174): pushing a tag v1.2.3 runs the tests,
# builds the Windows, Linux and macOS downloads as version 1.2.3 and publishes them as a GitHub release; the game's
# self-updater reads the latest release (UpdateService). Ordinary pushes and pull requests run nothing. A manual run
# (Actions > Build > Run workflow) builds artifacts as version 0.0.0-ci.N (they never update themselves) and publishes
# nothing.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test OpenPhantasie.sln -c Release

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rids: win-x64
          - os: ubuntu-latest
            rids: linux-x64
          - os: macos-latest
            rids: osx-arm64 osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Package
        shell: bash
        run: |
          for rid in ${{ matrix.rids }}; do
            python tools/scripts/package_release.py --rid "$rid" --version "$VERSION" --out dist \
              --repository "$GITHUB_REPOSITORY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: OpenPhantasie-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=docs/release-notes/${GITHUB_REF_NAME}.md
          ls -l dist
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "OpenPhantasie ${GITHUB_REF_NAME#v}" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "OpenPhantasie ${GITHUB_REF_NAME#v}" --generate-notes
          fi
